plugins {
    id 'org.jetbrains.kotlin.multiplatform'
}

kotlin {
    jvm()

    sourceSets {
        jvmMain {
            dependencies {
                implementation 'org.jsoup:jsoup:1.17.2'
            }
        }
        jvmTest {
            dependencies {
                implementation 'org.junit.jupiter:junit-jupiter:5.8.2'
            }
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
